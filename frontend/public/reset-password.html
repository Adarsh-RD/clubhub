<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Reset Password | Club Hub</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #050505;
      background-image:
        radial-gradient(at 0% 0%, rgba(225, 29, 72, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: #E2E8F0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-card {
      background: rgba(15, 15, 20, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .app-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #E11D48, #F59E0B);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.5rem;
      color: white;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .input-field {
      text-align: left;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #E11D48;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.2);
    }

    button {
      width: 100%;
      padding: 0.9rem;
      background: #E11D48;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }

    button:hover {
      background: #be123c;
    }

    .status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.75rem;
      border-radius: 8px;
      display: none;
    }

    .status-msg.error {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      display: block;
    }

    .status-msg.success {
      background: rgba(34, 197, 94, 0.1);
      color: #86efac;
      display: block;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="app-logo">C</div>
    <h1>Reset Password</h1>
    <p>Enter a new password for your account.</p>

    <div class="input-field">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Minimum 6 characters" required />
    </div>

    <div class="input-field">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
    </div>

    <button onclick="resetPassword()" id="submitBtn">Update Password</button>

    <div id="status" class="status-msg"></div>
    <div style="margin-top: 1.5rem;">
      <a href="/" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">Back to Login</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://clubhub-5eh7.onrender.com"; // Matches production

    async function resetPassword() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      if (!token) {
        statusEl.textContent = 'Invalid or missing reset token. Please request a new link.';
        statusEl.className = 'status-msg error';
        return;
      }

      if (newPassword.length < 6) {
        statusEl.textContent = 'Password must be at least 6 characters.';
        statusEl.className = 'status-msg error';
        return;
      }

      if (newPassword !== confirmPassword) {
        statusEl.textContent = 'Passwords do not match.';
        statusEl.className = 'status-msg error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      statusEl.className = 'status-msg';

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();

        if (res.ok) {
          statusEl.textContent = 'Password has been successfully reset! Redirecting to login...';
          statusEl.className = 'status-msg success';
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          statusEl.textContent = data.error || 'Failed to reset password.';
          statusEl.className = 'status-msg error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Please try again.';
        statusEl.className = 'status-msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    }
  </script>
</body>

</html>
